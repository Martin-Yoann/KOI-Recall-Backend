# ============================================================
# KOI Recall Backend — Local Development Database
#
# Usage:
#   docker compose up -d          # Start PostgreSQL
#   docker compose down           # Stop and remove container
#   docker compose down -v        # Also remove data volume
#
# After starting, configure DATABASE_URL in .env.local:
#   DATABASE_URL=postgresql://koi:koi_dev@localhost:5432/koi_recall
# ============================================================

version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: koi-recall-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: koi
      POSTGRES_PASSWORD: koi_dev
      POSTGRES_DB: koi_recall
    ports:
      - "5432:5432"
    volumes:
      - koi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koi -d koi_recall"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  koi_pgdata:
    name: koi_recall_pgdata
